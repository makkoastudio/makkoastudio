<body>

    <main>
        <a href="./index.html" class="gifgif"><img src="./multimedia/Nuevo gif.gif" alt="Logo" class="gif"></a>
        <div class="carrusel-container">
            <div class="carrusel-track">
                <img class="carrusel-slide" src="./multimedia/uno_Mesa de trabajo 1.jpg" alt="Imagen 1">
                <img class="carrusel-slide" src="./multimedia/dos_Mesa de trabajo 1.jpg" alt="Imagen 2">
                <img class="carrusel-slide" src="./multimedia/tres_Mesa de trabajo 1.jpg" alt="Imagen 3">
                <img class="carrusel-slide" src="./multimedia/capitan-02.png" alt="Imagen 4">

            <button class="prev">&#10094</button>

    <footer>
        <div class="derechos">

                <a href="https://www.instagram.com/mak.koa/" target="_blank"><img src="./multimedia/instagram_Mesa de trabajo 1.png" alt="Instagram" class="rrss"></a>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" 
    crossorigin="anonymous"></script>

        <script>
    const hamburguesa = document.getElementById("hamburguesa");
    const menu = document.getElementById("menu");

    hamburguesa.addEventListener("click", () => {
        menu.classList.toggle("activo");
    });</script>

    <script>
        const slides = document.querySelectorAll('.carrusel-slide');
        let currentIndex = 0;

        function showSlide(index) {
            slides.forEach((slide, i) => {
            slide.style.display = i === index ? 'block' : 'none';
        });
    }

        function nextSlide() {
            currentIndex = (currentIndex + 1) % slides.length;
            showSlide(currentIndex);
        }

        function prevSlide() {
            currentIndex = (currentIndex - 1 + slides.length) % slides.length;
            showSlide(currentIndex);
        }

        document.querySelector('.next').addEventListener('click', nextSlide);
        document.querySelector('.prev').addEventListener('click', prevSlide);

        showSlide(currentIndex);
        setInterval(nextSlide, 5000)
    </script>
<script>
    document.querySelectorAll('.navegacion a').forEach(link => {
        link.addEventListener('touchstart', () => {
            document.querySelectorAll('.navegacion a').forEach(a => a.classList.remove('activo'));
            link.classList.add('activo');
        });
    });
</script>
<script>
    const botonesRRSS = document.querySelectorAll('.rrss');
    botonesRRSS.forEach(boton => {
        boton.addEventListener('touchstart', () => {
            boton.classList.add('tocado');
            setTimeout(() => {
                boton.classList.remove('tocado');
            }, 300);
        });
    });
</script>
</body>
</html>
