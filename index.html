<html lang="es">
<head>

    integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" 
    crossorigin="anonymous">

    <link rel="stylesheet" href="styles/styles.css">
    <title>MakkoaStudio - Inicio</title>
</head>

<body>
    <header>
        <div class="top-row">
            <div class="logo-texto"><h1 class="craer">Craer para conectar</h1></div>
            <div class="hamburguesa" id="hamburguesa">&#9776;</div>
        </div>
        <nav>
            <ul class="navegacion" id="menu">
                <li><a href="./pages/quienes-somos.html">MAKKoa Studio</a></li>
                <li><a href="./pages/portfolio.html">Portfolio</a></li>
                <li><a href="./pages/Behind.html">Behind the scene</a></li>
                <li><a href="./pages/contacto.html">Contacto</a></li>
            </ul>
        </nav>
        <a href="./index.html" class="gifgif"><img src="./multimedia/Sin título (1920 x 540 px).gif" alt="Logo" class="gif"></a>
    </header>

    <main>
        <div class="carrusel-container">
            <div class="carrusel-track">
                <img class="carrusel-slide" src="./multimedia/uno_Mesa de trabajo 1.png" alt="Imagen 1">
                <img class="carrusel-slide" src="./multimedia/dos_Mesa de trabajo 1.png" alt="Imagen 2">
                <img class="carrusel-slide" src="./multimedia/tres_Mesa de trabajo 1.png" alt="Imagen 3">
                <img class="carrusel-slide" src="./multimedia/cuatro_Mesa de trabajo 1.png" alt="Imagen 4">
            </div>
            <button class="prev">&#10094</button>
            <button class="next">&#10095</button>
        </div>
    </main>

    <footer>
        <div class="derechos">
                <h4>Derechos Reservados</h4>
        </div>
        <div class="redes"> 
                <a href="https://www.instagram.com/mak.koa/" target="_blank"><img src="./multimedia/instagram_Mesa de trabajo 1.png" alt="Instagram" class="rrss"></a>
                <a href="http://www.behance.net/makdg" target="_blank"><img src="./multimedia/behance_Mesa de trabajo 1.png" alt="Behance" class="rrss"></a>
                <a href="https://www.facebook.com/profile.php?id=61558771463068" target="_blank"><img src="./multimedia/facebook_Mesa de trabajo 1.png" alt="Facebook" class="rrss"></a>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" 
    crossorigin="anonymous"></script>

        <script>
    const hamburguesa = document.getElementById("hamburguesa");
    const menu = document.getElementById("menu");

    hamburguesa.addEventListener("click", () => {
        menu.classList.toggle("activo");
    });</script>

    <script>
        const slides = document.querySelectorAll('.carrusel-slide');
        let currentIndex = 0;

        function showSlide(index) {
            slides.forEach((slide, i) => {
            slide.style.display = i === index ? 'block' : 'none';
        });
    }

        function nextSlide() {
            currentIndex = (currentIndex + 1) % slides.length;
            showSlide(currentIndex);
        }

        function prevSlide() {
            currentIndex = (currentIndex - 1 + slides.length) % slides.length;
            showSlide(currentIndex);
        }

        document.querySelector('.next').addEventListener('click', nextSlide);
        document.querySelector('.prev').addEventListener('click', prevSlide);

        showSlide(currentIndex);
        setInterval(nextSlide, 5000)
    </script>

</body>
</html>
